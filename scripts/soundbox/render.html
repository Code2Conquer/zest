<!doctype html>
<!-- The Zest Soundbox, ray-marched in one fragment shader. Rendered offline by render.mjs into
     transparent stills (public/soundbox/*.webp); the website never runs WebGL. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform vec3 uLight; uniform float uInt; uniform sampler2D uLogo; uniform float uYaw; uniform float uPitch; uniform float uDist;
const float R = 1.0;      // body radius
const float HH = 0.30;    // body half height
const float FIL = 0.20;   // edge fillet: a soft pebble, not a hard disc
const float TOP = 0.60;   // top of the body
const float RECESS = 0.72;// recess radius (the light ring sits between glass and recess wall)
const float GLASS = 0.60; // glass disc radius
float sdRCyl(vec3 p, float r, float h, float rb){ vec2 d = vec2(length(p.xz)-r+rb, abs(p.y)-h+rb); return min(max(d.x,d.y),0.0) + length(max(d,0.0)) - rb; }
float sdCyl(vec3 p, float r, float h){ vec2 d = vec2(length(p.xz)-r, abs(p.y)-h); return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }
float sdBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b+r; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r; }
float shell(vec3 p){
  // a slight taper: wider at the base than the top
  float taper = 1.0 + 0.035*(1.0 - clamp(p.y/TOP,0.0,1.0));
  vec3 q = vec3(p.x/taper, p.y, p.z/taper);
  float d = sdRCyl(q-vec3(0.0,HH,0.0), R, HH, FIL)*taper;
  d = max(d, -sdCyl(p-vec3(0.0,TOP,0.0), RECESS, 0.035));     // the recess for the ring and glass
  // the push-to-talk key on the side
  float a = -0.95; vec3 k = vec3(cos(a)*p.x - sin(a)*p.z, p.y, sin(a)*p.x + cos(a)*p.z);
  d = min(d, sdBox(k-vec3(R+0.005, HH, 0.0), vec3(0.03,0.035,0.11), 0.03));
  return d;
}
float glass(vec3 p){
  // a gently domed glass disc, a hair below the rim
  return sdRCyl(p-vec3(0.0,TOP-0.028,0.0), GLASS, 0.02, 0.016);
}
float scene(vec3 p){ return min(shell(p), glass(p)); }
vec2 map(vec3 p){ float s = shell(p), g = glass(p); float o = min(s,g); if(p.y < o) return vec2(p.y, 0.0); return vec2(o, s < g ? 1.0 : 2.0); }
vec3 nrm(vec3 p){ vec2 e = vec2(0.0007,0.0); return normalize(vec3(scene(p+e.xyy)-scene(p-e.xyy), scene(p+e.yxy)-scene(p-e.yxy), scene(p+e.yyx)-scene(p-e.yyx))); }
float softShadow(vec3 ro, vec3 rd, float k){ float res=1.0, t=0.02; for(int i=0;i<64;i++){ float h = scene(ro+rd*t); res = min(res, k*h/t); t += clamp(h, 0.01, 0.2); if(res<0.001 || t>8.0) break; } return clamp(res,0.0,1.0); }
float ao(vec3 p, vec3 n){ float o=0.0, s=1.0; for(int i=1;i<=6;i++){ float h=0.02+0.05*float(i); o += (h-scene(p+n*h))*s; s*=0.75; } return clamp(1.0-1.6*o, 0.0, 1.0); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
// a studio around the box: a bright softbox overhead-left, a darker floor
vec3 env(vec3 d){
  vec3 c = mix(vec3(0.10,0.10,0.11), vec3(0.75,0.74,0.72), smoothstep(-0.1, 0.8, d.y));
  float box = smoothstep(0.86, 0.97, dot(d, normalize(vec3(-0.45,0.85,0.25))));
  return c + vec3(3.2,3.1,2.9)*box;
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 ta = vec3(0.0, 0.12, 0.0);
  vec3 ro = ta + uDist*vec3(cos(uPitch)*sin(uYaw), sin(uPitch), cos(uPitch)*cos(uYaw));
  vec3 ww = normalize(ta-ro), uu = normalize(cross(ww, vec3(0,1,0))), vv = cross(uu, ww);
  vec3 rd = normalize(uv.x*uu + uv.y*vv + 3.1*ww);
  vec3 L = normalize(vec3(-0.55, 1.0, 0.45)); vec3 keyC = vec3(1.0,0.96,0.9)*2.4;
  vec3 F = normalize(vec3(0.9, 0.35, 0.3)); vec3 fillC = vec3(0.55,0.6,0.7)*0.45;
  float t = 0.0; vec2 h = vec2(0.0,-1.0); float halo = 0.0;
  for(int i=0;i<160;i++){
    vec3 p = ro + rd*t; h = map(p);
    float rr = length(p.xz);
    halo += exp(-length(vec2(rr-0.66, p.y-(TOP-0.02)))*26.0) * 0.012;
    if(h.x < 0.0003 || t > 20.0) break;
    t += h.x*0.8;
  }
  vec4 outc = vec4(0.0);
  vec3 p = ro + rd*t;
  if(t < 20.0 && h.y > 0.5){
    vec3 n = nrm(p); float rr = length(p.xz);
    float sh = softShadow(p+n*0.004, L, 10.0); float o = ao(p, n);
    float dif = clamp(dot(n,L),0.0,1.0); float wrap = clamp((dot(n,L)+0.35)/1.35,0.0,1.0);
    vec3 hv = normalize(L - rd); float fre = pow(1.0 - clamp(dot(n,-rd),0.0,1.0), 5.0);
    vec3 col;
    if(h.y > 1.5){
      // glass: near-black, glossy, reflecting the studio
      vec3 alb = vec3(0.012,0.013,0.016);
      float ca = cos(uYaw), sa = sin(uYaw);
      vec2 q = vec2(ca*p.x - sa*p.z, sa*p.x + ca*p.z);
      vec2 luv = vec2(q.x, q.y)/(2.0*GLASS*0.9) + 0.5;
      float logo = texture2D(uLogo, luv).a;
      vec3 refl = env(reflect(rd, n));
      float spec = pow(clamp(dot(n,hv),0.0,1.0), 220.0)*2.5;
      col = alb*(keyC*dif*sh + vec3(0.2)) + refl*mix(0.05, 0.9, fre) + keyC*spec*sh;
      col += vec3(0.42,0.43,0.45)*logo*0.55;                 // the etched mark
      col += uLight*uInt*exp(-max(GLASS-rr,0.0)*16.0)*0.25;   // the ring lighting the glass edge
    } else {
      bool ring = rr > GLASS-0.02 && rr < RECESS+0.005 && p.y > TOP-0.075 && n.y > 0.5;
      // ceramic: warm white, matte, with a soft sheen
      vec3 alb = vec3(0.84,0.81,0.76);
      float spec = pow(clamp(dot(n,hv),0.0,1.0), 28.0)*0.16;
      col = alb*(keyC*wrap*mix(0.35,1.0,sh)*0.85 + fillC*clamp(dot(n,F),0.0,1.0) + env(n)*0.32*o) + keyC*spec*sh;
      col += env(reflect(rd,n))*fre*0.18*o;
      if(ring){
        col = vec3(0.10,0.085,0.07)*o*(1.0-uInt) + uLight*uInt*1.15 + vec3(0.25)*uInt*0.2; // the light ring itself
      }
      // light spilling onto the top around the ring
      float topF = smoothstep(0.5, 0.9, n.y);
      col += uLight*uInt*exp(-max(rr-RECESS,0.0)*9.0)*topF*0.35*alb;
      // the recess wall catches the ring
      if(rr > RECESS-0.01 && rr < RECESS+0.04 && p.y > TOP-0.07 && n.y < 0.5) col += uLight*uInt*0.5;
    }
    col += uLight*uInt*halo*0.35;
    col = pow(aces(col), vec3(1.0/2.2));
    outc = vec4(col, 1.0);
  } else {
    // the counter: transparent, carrying only the shadow and the ring's light
    float a = 0.0; vec3 glowC = vec3(0.0); float g = 0.0;
    if(t < 20.0){
      float rr = length(p.xz);
      float sh = softShadow(p+vec3(0,0.002,0), L, 2.5);
      float o = ao(p, vec3(0,1,0));
      float contact = exp(-max(rr-1.0,0.0)*7.0) * smoothstep(1.22, 0.96, rr);
      a = clamp((1.0-sh)*0.22 + (1.0-o)*0.55 + contact*0.3, 0.0, 0.6);
      a *= 1.0 - smoothstep(1.4, 2.2, rr);
      g = uInt*exp(-max(rr-1.0,0.0)*5.0)*smoothstep(0.85,1.05,rr)*0.6;
    }
    g += uInt*halo*0.25;
    float A = clamp(max(a, g), 0.0, 1.0);
    // fade out before the frame edge, so no straight line shows on any background
    vec2 fc = gl_FragCoord.xy; float edge = min(min(fc.x, uRes.x-fc.x), min(fc.y, uRes.y-fc.y)) / uRes.y;
    A *= smoothstep(0.0, 0.12, edge);
    vec3 rgb = A > 0.0 ? (uLight*g) / A : vec3(0.0);
    outc = vec4(pow(clamp(rgb,0.0,1.0), vec3(1.0/2.2)), A);
  }
  gl_FragColor = outc;
}`;
const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;
window.render = function(opts){
  const { w, h, light, intensity, yaw = 0.55, pitch = 0.52, dist = 6.4 } = opts;
  const c = document.getElementById('c'); c.width = w; c.height = h;
  const gl = c.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true, antialias: false });
  if (!gl) throw new Error('no webgl');
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  // the etched "zest" mark, drawn into a texture
  const lc = document.createElement('canvas'); lc.width = lc.height = 512; const x = lc.getContext('2d');
  x.font = '600 92px Inter, Helvetica, Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
  x.letterSpacing = '22px'; x.fillText('zest', 256 + 11, 256);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, lc);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform2f(gl.getUniformLocation(pr, 'uRes'), w, h);
  gl.uniform3f(gl.getUniformLocation(pr, 'uLight'), ...light);
  gl.uniform1f(gl.getUniformLocation(pr, 'uInt'), intensity);
  gl.uniform1f(gl.getUniformLocation(pr, 'uYaw'), yaw);
  gl.uniform1f(gl.getUniformLocation(pr, 'uPitch'), pitch);
  gl.uniform1f(gl.getUniformLocation(pr, 'uDist'), dist);
  gl.uniform1i(gl.getUniformLocation(pr, 'uLogo'), 0);
  gl.viewport(0, 0, w, h); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
  return c.toDataURL('image/png');
};
</script>
