name: Sync mail and orders
# Calls the app's /api/cron every 15 minutes. Needs two repository secrets:
#   ZEST_URL     e.g. https://zest-dusky.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ZEST_URL: ${{ secrets.ZEST_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call /api/cron
        if: env.ZEST_URL != '' && env.CRON_SECRET != ''
        run: curl -fsS --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "$ZEST_URL/api/cron"
